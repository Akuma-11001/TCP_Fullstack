        
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://http_gateway:9000;
        proxy_set_header Host $host;
        proxy_set_header X_Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ = 404;
    }
}
